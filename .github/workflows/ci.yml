name: Harmoness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate composition spec
        run: python -m json.tool specs/constitution-wheel-v0.json >/dev/null
      - name: Scan committed generation witnesses
        run: python scripts/verify_repository.py
      - name: Static site smoke check
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          node --check site/app.js
          grep -q "Constitution Wheel" site/index.html
          grep -q "LOCAL ANALYSIS" site/index.html
